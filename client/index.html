<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Devine Tête</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Devine Tête 🕵️</h1>

  <!-- Écran 1 : accueil -->
  <div id="ecran-accueil">
    <input type="text" id="input-prenom" placeholder="Ton prénom"><br>

    <div id="bloc-creer">
      <label for="input-nb-manches">Nombre de manches</label>
      <input type="number" id="input-nb-manches" value="1" min="1" max="10">
      <button id="btn-creer">Créer une partie</button>
    </div>

    <hr>

    <input type="text" id="input-code" placeholder="Code de la partie">
    <button id="btn-rejoindre">Rejoindre</button>
  </div>

  <!-- Écran 2 : lobby -->
  <div id="ecran-lobby" class="cache">
    <h2>Code de la partie : <span id="code-affiche"></span></h2>
    <p>Joueurs :</p>
    <ul id="liste-joueurs"></ul>

    <div id="choix-avatar">
      <h3>Ton avatar</h3>
      <div id="apercu-avatar"></div>
      <div class="ligne-choix">
        <button class="fleche" data-cat="chapeau" data-sens="-1">◀</button>
        <span id="nom-chapeau"></span>
        <button class="fleche" data-cat="chapeau" data-sens="1">▶</button>
      </div>
      <div class="ligne-choix">
        <button class="fleche" data-cat="tete" data-sens="-1">◀</button>
        <span id="nom-tete"></span>
        <button class="fleche" data-cat="tete" data-sens="1">▶</button>
      </div>
      <div class="ligne-choix">
        <button class="fleche" data-cat="buste" data-sens="-1">◀</button>
        <span id="nom-buste"></span>
        <button class="fleche" data-cat="buste" data-sens="1">▶</button>
      </div>
      <div class="ligne-choix">
        <button class="fleche" data-cat="jambes" data-sens="-1">◀</button>
        <span id="nom-jambes"></span>
        <button class="fleche" data-cat="jambes" data-sens="1">▶</button>
      </div>
    </div>

    <button id="btn-demarrer" class="cache">Démarrer la partie</button>
    <p id="attente-hote" class="cache">En attente que l'hôte lance la partie...</p>
  </div>

  <!-- Écran 3 : attribution -->
  <div id="ecran-attribution" class="cache">
    <h2 id="titre-attribution">Choisis un personnage pour <span id="nom-cible"></span></h2>
    <input type="text" id="input-personnage" placeholder="Nom du personnage">
    <button id="btn-valider-perso">Valider</button>
  </div>

  <!-- Écran 4 : jeu -->
  <div id="ecran-jeu" class="cache">
    <p id="info-manche"></p>
    <h2 id="info-tour"></h2>

    <div id="carrousel">
      <button id="fleche-gauche" class="fleche-carrousel">◀</button>
      <div id="carte-carrousel">
        <p id="carrousel-mot"></p>
        <div id="carrousel-avatar"></div>
        <p id="carrousel-nom"></p>
        <p id="carrousel-statut"></p>
      </div>
      <button id="fleche-droite" class="fleche-carrousel">▶</button>
    </div>

    <hr>
    <input type="text" id="input-deviner" placeholder="Qui suis-je ?">
    <button id="btn-deviner">Deviner mon personnage</button>
    <p id="message-jeu"></p>
  </div>

  <!-- Écran 5 : fin de manche -->
  <div id="ecran-fin-manche" class="cache">
    <h2>Résultats de la manche <span id="num-manche-finie"></span></h2>
    <ol id="liste-resultats-manche"></ol>
    <button id="btn-manche-suivante" class="cache">Manche suivante</button>
    <p id="attente-hote-manche" class="cache">En attente que l'hôte lance la manche suivante...</p>
  </div>

  <!-- Écran 6 : fin de partie -->
  <div id="ecran-fin" class="cache">
    <h2>🏆 Classement final</h2>
    <ol id="liste-classement"></ol>
  </div>

  <div id="erreur" class="cache"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="avatars.js"></script>
  <script src="script.js"></script>
</body>
</html>
